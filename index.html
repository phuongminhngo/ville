<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Galerie Phuong Ngo Paris</title>

<style>
/* Layout: one full-screen city (2D plan or 3D), a pixel top bar, a side panel that becomes a bottom sheet on phones, and a project card overlay. Single sunset look with a night mode. */
:root{--sky1:#5d4a86;--sky2:#b0679a;--sky3:#f08a6c;--sky4:#ffc58a;--paper:#fffaf2;--ink:#2a2321;--muted:#8a7d76;--blue:#6f8fc8;--pink:#d0607f;--line:rgba(42,35,33,.16);--sun:#f6d36b;
 --pixel:"Silkscreen","Courier New",monospace;--term:"VT323","Courier New",monospace;color-scheme:light}
html,body{height:100%}
body{background:var(--sky4);color:var(--ink);font-family:var(--term);font-size:20px;overflow:hidden}
.stage{position:fixed;inset:0;background:linear-gradient(180deg,#f7d9c0 0%,#f8c8a3 55%,#f3b394 100%)}
body.night .stage{background:linear-gradient(180deg,#0b1030 0%,#1f2557 55%,#463c78 100%)}
#v3d{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;
 background:radial-gradient(circle at 82% 30%,#fff3c4 0,#ffd98a 3%,rgba(255,200,120,.35) 7%,rgba(255,200,120,0) 14%),linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 30%,var(--sky3) 62%,var(--sky4) 100%)}
body.night #v3d{background:radial-gradient(circle at 80% 14%,#fffbe8 0,#fff4cf 2.2%,rgba(255,240,200,.25) 4%,rgba(0,0,0,0) 8%),radial-gradient(1.5px 1.5px at 12% 10%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 22%,#fff,transparent),radial-gradient(1px 1px at 46% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 63% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 6%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 26%,#fff,transparent),radial-gradient(1px 1px at 22% 34%,#fff,transparent),linear-gradient(180deg,#0b1030 0%,#1f2557 45%,#463c78 100%)}
#v2d{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:92px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#v2d svg{width:100%;height:100%;max-width:100%}
body.has-panel #v2d{padding-right:calc(400px + 32px)}
body.night #map{filter:brightness(.62) saturate(.85) hue-rotate(-12deg)}
body.night #map .lp{filter:drop-shadow(0 0 3px #ffd27a)}
.pin{cursor:pointer;outline:none}
.pin:hover .tag,.pin:focus-visible .tag{stroke:var(--pink);stroke-width:2.5}
.pin.sel .tag{fill:#eef3fc;stroke:var(--blue);stroke-width:3}
.av line{stroke:#ddcbb1;stroke-width:9;stroke-linecap:round}
.tr{fill:#7fa66e} .lp{fill:#ffcf6e}
.st{fill:#efe5d2;stroke:#2a2321;stroke-width:2} .gl{fill:#cfe3ee;stroke:#2a2321;stroke-width:2} .ck{fill:#fff7e6;stroke:#2a2321;stroke-width:2} .pond{fill:#8fbfc4;stroke:#2a2321;stroke-width:1.5}
.tag{fill:#fffaf2;fill-opacity:.94;stroke:#2a232130;stroke-width:1.5} .tn{font:14px Silkscreen;text-anchor:middle;fill:#2a2321} .ts{font:17px VT323;text-anchor:middle;fill:#6f8fc8} .pk{fill:#d0607f} .tc{font:13px VT323;text-anchor:end;fill:#9a8f88}
.pin.sel .tag{fill:#eef3fc;stroke:#7f9fd8;stroke-width:2.5}
.eif path{fill:#8a5a3c;stroke:#2a2321;stroke-width:2} .eif line{stroke:#2a2321;stroke-width:2}
.lm{font:10px Silkscreen;text-anchor:middle;fill:#4a3a36}
/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.bar>*{pointer-events:auto}
.logo{background:rgba(255,250,242,.92);border:1.5px solid var(--line);border-radius:16px;padding:0;width:236px;height:96px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.h2x{--sb:#86aede;--rose:#c95b84;position:relative;font-weight:400;font-size:22px;line-height:1;margin:0;letter-spacing:0;white-space:nowrap;width:fit-content;color:var(--ink)}
.h2x .sc{font-family:"Pinyon Script",cursive;font-weight:400}
.h2x .px{font-family:Silkscreen,monospace}
.h2x .l1,.h2x .l2{display:block;position:relative}
.h2x .l1 .sc{font-size:2.7em;line-height:.5;color:var(--sb);margin-right:-.32em;position:relative;z-index:0}
.h2x .l1 .px{position:relative;z-index:1}
.h2x .l2{margin:-.05em 0 0 1.7em}
.h2x .l2 .px{color:var(--rose);font-size:1.15em}
.h2x .l2 .sc{font-size:2em;line-height:.5;margin-left:-.08em}
.h2x .an{position:absolute;width:0;height:0}
.h2x .an i{display:block;font-style:normal;font-family:Oswald,sans-serif;font-weight:300;font-size:9px;line-height:1.2;color:var(--muted);white-space:nowrap}
.h2x .st{position:absolute;width:.4em;height:.4em}
@media (max-width:760px){.h2x{font-size:17px}.h2x .an{display:none}.logo{width:150px;height:76px}}
.seg{display:flex;background:rgba(255,250,242,.92);border:1.5px solid var(--line);border-radius:999px;padding:3px}
.seg button,.zoom button{font:12px var(--pixel);color:var(--ink);background:none;border:0;border-radius:999px;padding:8px 12px;cursor:pointer;letter-spacing:.5px}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.seg button:focus-visible,.zoom button:focus-visible,.it:focus-visible,.mus:focus-visible,.x:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.zoom{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.zoom button{background:rgba(255,250,242,.92);border:1.5px solid var(--line);width:44px;height:44px;padding:0;font-size:18px}
.zoom button.wide{width:auto;padding:0 12px;font-size:11px}
.hint{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:18px;color:var(--ink);background:rgba(255,250,242,.85);padding:4px 12px;border-radius:999px;white-space:nowrap;max-width:calc(100% - 140px);overflow:hidden;text-overflow:ellipsis}
body.night .hint{background:rgba(20,22,50,.75);color:#eef}
/* panel */
.panel{position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px));top:96px;bottom:16px;width:400px;max-width:calc(100% - 32px);background:var(--paper);border:1.5px solid var(--line);border-radius:18px;box-shadow:0 10px 40px rgba(60,30,40,.18);display:flex;flex-direction:column;overflow:hidden}
.panel header{padding:18px 20px 10px;display:grid;gap:2px;position:relative}
.panel .ey{font-size:17px;color:var(--muted)}
.panel h2{margin:0;font:normal 30px var(--pixel);line-height:1.1;text-wrap:balance}.panel h2 b{color:var(--pink);font-weight:normal}
.panel .sec{font-size:24px;color:var(--blue)}
.panel .desc{font-size:19px;color:#5e524c;margin:6px 0 0;line-height:1.15}
.panel .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font:14px var(--pixel);cursor:pointer}
.list{overflow:auto;padding:0 20px 18px;display:grid;gap:0}
.it,.mus{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;padding:10px 0;border:0;border-top:1px dashed #dccbb6;background:none;text-align:left;font:20px var(--term);color:var(--ink);cursor:pointer;width:100%}
.it:hover span,.mus:hover span{color:var(--pink)}
.it .th,.mus .th{width:52px;height:40px;border-radius:7px;border:1.5px solid var(--ink);background:#f2e6d8 center/cover no-repeat;display:grid;place-items:center;font:14px var(--pixel)}
.it span,.mus span{min-width:0;line-height:1.05}.it small,.mus small{display:block;color:var(--muted);font-size:16px}
.it em,.mus em{font-style:normal;color:var(--pink);font-family:var(--pixel);font-size:12px}
/* card */
.card-wrap{position:fixed;inset:0;z-index:9;background:rgba(30,20,40,.45);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{position:relative;background:var(--paper);border-radius:20px;border:1.5px solid var(--line);width:min(760px,100%);max-height:100%;overflow:auto;padding:26px 28px 28px;display:grid;gap:12px}
.card .ey{font-size:18px;color:var(--muted)}
.card h3{margin:0;font:normal 30px var(--pixel);line-height:1.1;text-wrap:balance}.card h3 b{color:var(--pink);font-weight:normal}
.card .q{font-size:26px;color:var(--blue)}
.card p{margin:0;font-size:21px;line-height:1.2;max-width:62ch}
.card ul{margin:0;padding-left:1.1em;font-size:20px;line-height:1.2;display:grid;gap:4px}
.card h4{margin:6px 0 0;font:normal 13px var(--pixel);letter-spacing:1px;color:var(--pink)}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{font-size:17px;border:1.5px solid var(--line);border-radius:999px;padding:1px 10px;background:#fff}
.stats{display:flex;flex-wrap:wrap;gap:12px}.stats div{border:1.5px dashed #dccbb6;border-radius:12px;padding:8px 12px;font-size:18px;max-width:240px}.stats b{display:block;font:normal 22px var(--pixel);color:var(--blue)}
.links{display:flex;flex-wrap:wrap;gap:8px}.links a{font-size:19px;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:999px;padding:3px 12px;background:#fff}.links a:hover{background:var(--ink);color:#fff}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.gal figure{margin:0}.gal img{width:100%;border-radius:10px;border:1.5px solid var(--line);display:block}.gal figcaption{font-size:16px;color:var(--muted)}
.card .x{position:sticky;top:0;justify-self:end;margin:-10px -10px -46px 0;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font:14px var(--pixel);cursor:pointer;z-index:1}
.see{display:flex;gap:8px;flex-wrap:wrap}.see button{font:18px var(--term);border:1.5px solid var(--blue);color:var(--blue);background:#fff;border-radius:999px;padding:2px 12px;cursor:pointer}
@media (max-width:760px){
 body.has-panel #v2d{padding-right:16px;padding-bottom:46vh}
 .panel{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:44vh}
 .panel h2{font-size:22px}
 .hint{display:none}.zoom{bottom:calc(46vh + 16px)}
 .card{padding:20px 18px}.card h3{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* street-plaque headers */
.plq{position:relative;background:#2c4a93;border:7px solid #2f6b52;border-radius:8px;outline:2px solid rgba(255,255,255,.85);outline-offset:-12px;padding:16px 18px 12px;color:#fff;margin-top:22px}
.plq .arr{position:absolute;left:50%;transform:translateX(-50%);top:-30px;background:#2c4a93;border:6px solid #2f6b52;border-bottom:0;border-radius:90px 90px 0 0;padding:4px 18px 0;font:12px var(--pixel);white-space:nowrap}
.plq h2{color:#fff;text-align:center}.plq h2 b{color:#ffb3c8}.plq .sec{color:#cfe0ff;text-align:center}
.panel .plq+.desc{margin-top:10px}
#map .tag{fill:#2c4a93;stroke:#2f6b52;stroke-width:4}#map .tn{fill:#fff}#map .ts{fill:#cfe0ff}#map .pk{fill:#ffb3c8}#map .tc{fill:#cfe0ff}
#map .pin.sel .tag{fill:#3a5cb0;stroke:#f6d36b}
/* mosaic hunt */
.mosc{font:12px var(--pixel);background:rgba(255,250,242,.92);border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;color:var(--ink)}
.mosc b{color:var(--pink);font-weight:normal}
.toast{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(460px,calc(100% - 32px));background:var(--paper);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(60,30,40,.25);padding:14px 16px;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.toast img{width:56px;height:56px;image-rendering:pixelated;border-radius:6px;border:1.5px solid var(--ink)}
.toast h5{margin:0;font:normal 13px var(--pixel);color:var(--pink)}.toast p{margin:2px 0 6px;font-size:19px;line-height:1.1}
.toast button{font:11px var(--pixel);border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:5px 10px;cursor:pointer;margin-right:6px}
#map image.mz{cursor:pointer}#map image.mz.found{opacity:.35}
.inbar{position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left,0px));top:calc(84px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center}
.inbar button,.enter{font:12px var(--pixel);background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 14px;cursor:pointer}
.inbar span{font:12px var(--pixel);background:rgba(255,250,242,.92);border:1.5px solid var(--line);border-radius:999px;padding:9px 12px}
.enter{margin-top:10px;justify-self:start;background:var(--pink)}
.mus small.md{color:#5e524c;font-size:17px;margin-top:2px;line-height:1.05}
.th.ic{background:#2c4a93!important;color:#fff;border-color:#2f6b52!important}
#vin{transition:opacity .6s ease}
.fade{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 55%,rgba(255,240,220,.95),rgba(246,214,190,.98));opacity:0;transition:opacity .5s ease}.fade.on{opacity:1}
@media (prefers-reduced-motion:reduce){#vin,.fade{transition:none}}
.it{position:relative}.it .pv{position:absolute;right:28px;bottom:calc(100% - 8px);width:220px;max-width:70%;border-radius:10px;border:1.5px solid var(--ink);box-shadow:0 10px 24px rgba(40,20,30,.25);background:#fff;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:3}
.it:hover .pv,.it:focus-visible .pv{opacity:1;transform:none}

/* ===== game-style interface ===== */
.bar{align-items:flex-start;flex-wrap:nowrap}
.logo{transform-origin:top left}
.bar-r{margin-left:auto;display:flex;gap:8px}
.ib{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:rgba(255,250,242,.94);font:20px var(--term);color:var(--ink);cursor:pointer;box-shadow:0 4px 14px rgba(60,30,40,.14)}
.ib:focus-visible,.cc button:focus-visible,.bub button:focus-visible,.rec:focus-visible,.mi:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.menu{position:fixed;z-index:7;right:max(16px,env(safe-area-inset-right,0px));top:calc(66px + env(safe-area-inset-top,0px));background:var(--paper);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(60,30,40,.2);padding:12px;display:grid;gap:10px;width:min(280px,calc(100vw - 32px))}
.menu .seg{justify-content:stretch}.menu .seg button{flex:1}.menu .mosc{width:100%;text-align:left}
.mi{font:12px var(--pixel);text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;color:var(--ink)}
.zoom,.hint,.inbar{display:none!important}
/* mini-map */
#v2d{position:fixed!important;inset:auto;z-index:4;right:max(16px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));width:150px;height:150px;padding:0!important;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 18px rgba(60,30,40,.25);background:#f6e2cc;display:block}
body.has-panel #v2d{padding:0!important}
#v2d svg{width:100%;height:100%;display:block;cursor:pointer}
#map .pin>g,#map .lm,#map text{display:none}
#map .pin.sel>*{filter:drop-shadow(0 0 6px #fff)}
/* carousel */
.car{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.car::before,.car::after{content:"";flex:0 0 calc(50vw - 140px)}
.cc{flex:0 0 240px;scroll-snap-align:center;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;box-shadow:0 6px 18px rgba(60,30,40,.16);display:flex;align-items:center;gap:6px;padding:8px 8px 8px 10px;min-width:0;transition:transform .2s,border-color .2s}
.cc.on{border-color:var(--blue);transform:translateY(-4px)}
.cc-go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.cc-ic{flex:none;width:46px;height:46px;border-radius:12px;background:#2c4a93 center/cover no-repeat;color:#fff;display:grid;place-items:center;border:2px solid #2f6b52;font-style:normal;font:20px var(--term)}
.cc-go span{min-width:0;display:grid;line-height:1.05}.cc-go b{font:normal 13px var(--pixel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cc-go small{font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cc-go em{font-style:normal;font-size:15px;color:var(--pink)}
.cc-in{flex:none;font:11px var(--pixel);background:var(--pink);color:#fff;border:0;border-radius:999px;padding:9px 10px;cursor:pointer}
.car.in .cc{flex-basis:220px}

.bub{position:fixed;z-index:4;left:0;top:0;display:flex;align-items:center;gap:10px;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:8px 8px 8px 10px;box-shadow:0 10px 24px rgba(60,30,40,.22);margin-top:-14px;max-width:min(300px,80vw)}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;width:14px;height:14px;background:var(--paper);border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bub .bi{flex:none;width:36px;height:36px;border-radius:10px;background:#2c4a93;color:#fff;display:grid;place-items:center}.bub .bi svg{width:22px;height:22px}
.bub span{display:grid;line-height:1.05;min-width:0}.bub b{font:normal 13px var(--pixel)}.bub small{font-size:16px;color:var(--muted)}
.bub button{flex:none;font:11px var(--pixel);background:var(--pink);color:#fff;border:0;border-radius:999px;padding:9px 11px;cursor:pointer}
.tip{position:fixed;z-index:6;left:0;top:0;pointer-events:none;font:11px var(--pixel);background:var(--ink);color:#fff;border-radius:8px;padding:6px 8px;white-space:nowrap}
.rec{position:fixed;z-index:5;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:rgba(255,250,242,.94);font:20px var(--term);cursor:pointer;box-shadow:0 4px 14px rgba(60,30,40,.14)}
/* list: bottom sheet on phone, drawer on laptop; closed by default */
.sheet{position:fixed;z-index:8;right:max(16px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));bottom:16px;width:380px;max-width:calc(100% - 32px);display:flex;flex-direction:column;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(60,30,40,.25);transform:translateX(calc(100% + 32px));transition:transform .3s ease;overflow:hidden}
.sheet.open{transform:none}
.sheet .panel{position:static!important;inset:auto!important;width:auto!important;max-width:none!important;max-height:none!important;flex:1;min-height:0;border:0!important;box-shadow:none!important;border-radius:0!important;background:none}
.grab{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;font:11px var(--pixel);color:var(--muted);background:none;border:0;border-bottom:1px dashed #dccbb6;padding:10px;cursor:pointer}
.grab i{width:40px;height:5px;border-radius:3px;background:#d8c9b8;display:none}
@media (max-width:760px){
 .logo{transform:scale(.72)}.ib{width:42px;height:42px}
